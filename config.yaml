---
- name: Configure the Kali Machine
  hosts: localhost
  vars:
    user: "{{ lookup('env', 'USER') }}"
    user_home: "/home/{{ user }}"
    docker_gpg_key_url: "https://download.docker.com/linux/debian/gpg"
    docker_repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian bookworm stable"
    burpsuite_extras_dir: "/usr/local/lib/BurpSuite"
    burpsuite_extras_jars:
      jruby:
        jar: jruby-complete.jar
        url: https://repo1.maven.org/maven2/org/jruby/jruby-complete/9.4.0.0/jruby-complete-9.4.0.0.jar
        checksum: sha256:e6817cf528976a50a054910f006ee34df07c4580c8a2a4c8c8d61cda0238a108
      jython:
        jar: jython-standalone.jar
        url: https://repo1.maven.org/maven2/org/python/jython-standalone/2.7.3/jython-standalone-2.7.3.jar
        checksum: sha256:da7f3d829b148bcfa86b059dc964e3a8556fedb021096c8db07e30c66faab9b4
    FirefoxPlugins:
      - "wappalyzer"
      - "dotgit"
      - "foxyproxy-standard"
    vscode_extensions:
      - GitHub.github-vscode-theme
      - PKief.material-icon-theme
    # Grouped rather than one 96-package list so apt reports per batch: the run
    # shows progress instead of sitting silent for minutes, and a failure names
    # the group that broke. Retries then re-attempt only that group.
    apt_package_groups:
      - name: core CLI tools
        packages:
          - zsh
          - xsel
          - curl
          - wget
          - git
          - grc
          - unzip
          - fzf
          - bat
          - eza
          - ripgrep
          - fd-find
          - ansifilter
          - exiftool
          - pipx
      - name: desktop, fonts and RDP clients
        packages:
          - chromium
          - fonts-firacode
          - kali-community-wallpapers
          - xfce4-panel-profiles
          - freerdp3-x11
          - rdesktop
      - name: recon and scanning
        packages:
          - nmap
          - masscan
          - naabu
          - dnsrecon
          - subfinder
          - assetfinder
          - nbtscan
          - onesixtyone
          - snmp
          - snmp-mibs-downloader
          - oscanner
          - redis-tools
          - autorecon
          - seclists
      - name: web testing
        packages:
          - nikto
          - whatweb
          - gobuster
          - feroxbuster
          - ffuf
          - dirsearch
          - arjun
          - sqlmap
          - sslscan
          - burpsuite
      - name: Windows and Active Directory
        packages:
          - impacket-scripts
          - enum4linux
          - smbclient
          - smbmap
          - krbrelayx
          - rubeus
          - responder
          - evil-winrm-py
          - powershell
      - name: cracking and wireless
        packages:
          - john
          - hashcat
          - aircrack-ng
      - name: exploitation and pivoting
        packages:
          - metasploit-framework
          - ligolo-ng
      # kali-tools-windows-resources metapackage expanded to its members,
      # minus powercat + shellter (both hard Depends of the metapackage and
      # currently unfetchable via Kali's Cloudflare mirror -> 403 Forbidden).
      # Installing the members directly lets the rest of the set through.
      - name: Windows resources (expanded metapackage)
        packages:
          - dbd
          - dnschef
          - heartleech
          - hyperion
          - mimikatz
          - ncat-w32
          - ollydbg
          - regripper
          - sbd
          - secure-socket-funneling-windows-binaries
          - tftpd32
          - wce
          - windows-binaries
          - windows-privesc-check
      - name: build toolchains and dev headers
        packages:
          - cargo
          - golang-go
          - gcc-mingw-w64-x86-64
          - musl-tools
          - libclang-dev
          - python3-xlsxwriter
          - libsmbclient-dev
          - freetds-dev
          - libgcrypt20-dev
          - libidn-dev
          - libpcre2-dev
          - libpq-dev
          - libapr1-dev
          - libaprutil1-dev
          - libsvn-dev
          - libfbclient2
          - libmysql++-dev
          - freerdp3-dev
          - libssh-dev
          - libsmb2-dev
          - libkrb5-dev
          - libsasl2-modules-gssapi-mit
          - libnss3

  tasks:
    - name: Remove conflicting vscode.sources file if exists
      become: true
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/vscode.sources
        state: absent

    - name: Ensure system is fully upgraded before installing new packages
      become: true
      ansible.builtin.apt:
        update_cache: true
        upgrade: full

    - name: Ensure gnupg is installed (provides gpg for --dearmor)
      become: true
      ansible.builtin.apt:
        name: gnupg
        state: present

    - name: Add VS Code GPG key
      become: true
      ansible.builtin.shell: |
        set -o pipefail
        wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor --yes -o /usr/share/keyrings/packages.microsoft.gpg
      args:
        executable: /bin/bash
      changed_when: false

    - name: Add VS Code repository
      become: true
      ansible.builtin.shell: |
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" > /etc/apt/sources.list.d/vscode.list
      args:
        creates: /etc/apt/sources.list.d/vscode.list

    - name: Install Visual Studio Code
      become: true
      ansible.builtin.apt:
        update_cache: true
        name: code
        state: present

    - name: Remove netexec package
      become: true
      ansible.builtin.apt:
        name: netexec
        state: absent

    - name: Refresh apt cache before resolving the required package set
      become: true
      ansible.builtin.apt:
        update_cache: true

    # Diagnostic pass. A retry loop only prints the module's error on its final
    # attempt, so a bad package name used to show up as five silent
    # "FAILED - RETRYING" lines. This names every unresolvable package up front.
    # --dry-run does not download, so mirror 403s still surface in the install
    # below -- those are the transient failures the retries actually exist for.
    - name: Check that every required package resolves (dry run)
      become: true
      ansible.builtin.command:
        argv: "{{ ['apt-get', 'install', '--dry-run', '-q'] + (apt_package_groups | map(attribute='packages') | flatten) }}"
      environment:
        DEBIAN_FRONTEND: noninteractive
      register: apt_preflight
      changed_when: false
      failed_when: false

    - name: Show why apt could not resolve the package set
      ansible.builtin.debug:
        msg: "{{ apt_preflight.stderr_lines | default([]) }}"
      when: apt_preflight.rc != 0

    - name: Stop when a required package cannot be resolved at all
      ansible.builtin.fail:
        msg: >-
          apt cannot resolve part of the required package set (see the message
          above). That is a package name or dependency problem, not a transient
          network error, so retrying will not fix it -- correct
          apt_package_groups in this playbook.
      when:
        - apt_preflight.rc != 0
        - apt_preflight.stderr is search('Unable to locate package|has no installation candidate|Unable to correct problems')

    - name: Install all required apps
      become: true
      ansible.builtin.apt:
        name: "{{ item.packages }}"
        state: present
      loop: "{{ apt_package_groups }}"
      loop_control:
        label: "{{ item.name }} ({{ item.packages | length }} packages)"
      register: apt_install_apps
      until: apt_install_apps is succeeded
      retries: 5
      delay: 15

    - name: Install Shortscan
      ansible.builtin.shell: |
        go install github.com/bitquark/shortscan/cmd/shortscan@latest
      args:
        executable: /bin/bash
        creates: "{{ user_home }}/go/bin/shortscan"
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Install ldapnomnom
      ansible.builtin.shell: |
        go install github.com/lkarlslund/ldapnomnom@latest
      args:
        executable: /bin/bash
        creates: "{{ user_home }}/go/bin/ldapnomnom"
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Install katana
      ansible.builtin.shell: |
        go install github.com/projectdiscovery/katana/cmd/katana@latest
      args:
        executable: /bin/bash
        creates: "{{ user_home }}/go/bin/katana"
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Install MSSQLHound (Go)
      ansible.builtin.shell: |
        go install github.com/SpecterOps/MSSQLHound/cmd/mssqlhound@latest
      args:
        executable: /bin/bash
        creates: "{{ user_home }}/go/bin/mssqlhound"
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Clone RelayKing repository
      ansible.builtin.git:
        repo: https://github.com/depthsecurity/RelayKing-Depth.git
        dest: '{{ user_home }}/Binaries/RelayKing'
        update: true
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Create RelayKing virtualenv
      ansible.builtin.command: 'python3 -m venv {{ user_home }}/Binaries/RelayKing/venv'
      args:
        creates: '{{ user_home }}/Binaries/RelayKing/venv/bin/activate'

    - name: Install RelayKing requirements inside venv
      ansible.builtin.pip:
        requirements: '{{ user_home }}/Binaries/RelayKing/requirements.txt'
        virtualenv: '{{ user_home }}/Binaries/RelayKing/venv'
        virtualenv_python: python3
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Clone Impacket-Partial-Mic repository
      ansible.builtin.git:
        repo: https://github.com/decoder-it/impacket-partial-mic.git
        dest: '{{ user_home }}/Binaries/Impacket-Partial-Mic'
        update: true
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Create Impacket-Partial-Mic virtualenv
      ansible.builtin.command: 'python3 -m venv {{ user_home }}/Binaries/Impacket-Partial-Mic/venv'
      args:
        creates: '{{ user_home }}/Binaries/Impacket-Partial-Mic/venv/bin/activate'

    - name: Install Impacket-Partial-Mic into virtualenv
      ansible.builtin.pip:
        name: '{{ user_home }}/Binaries/Impacket-Partial-Mic'
        virtualenv: '{{ user_home }}/Binaries/Impacket-Partial-Mic/venv'
        virtualenv_python: python3
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Clone gMSADumper repository
      ansible.builtin.git:
        repo: 'https://github.com/micahvandeusen/gMSADumper.git'
        dest: '{{ user_home }}/Binaries/gMSADumper'
        version: 'main'
        update: true
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Create gMSADumper virtualenv
      ansible.builtin.command: 'python3 -m venv {{ user_home }}/Binaries/gMSADumper/venv'
      args:
        creates: '{{ user_home }}/Binaries/gMSADumper/venv/bin/activate'

    - name: Install gMSADumper requirements inside venv
      ansible.builtin.pip:
        requirements: '{{ user_home }}/Binaries/gMSADumper/requirements.txt'
        virtualenv: '{{ user_home }}/Binaries/gMSADumper/venv'
        virtualenv_python: python3
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Ensure ~/.local/bin exists
      ansible.builtin.file:
        path: "{{ user_home }}/.local/bin"
        state: directory
        mode: '0755'

    - name: Create gMSADumper wrapper in ~/.local/bin
      ansible.builtin.copy:
        dest: "{{ user_home }}/.local/bin/gMSADumper"
        mode: '0755'
        content: |
          #!/bin/bash
          exec "{{ user_home }}/Binaries/gMSADumper/venv/bin/python" "{{ user_home }}/Binaries/gMSADumper/gMSADumper.py" "$@"

    - name: Clone ntlm_theft repository
      ansible.builtin.git:
        repo: 'https://github.com/Greenwolf/ntlm_theft.git'
        dest: '{{ user_home }}/Binaries/ntlm_theft'
        version: 'master'
        update: true
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Create ntlm_theft wrapper in ~/.local/bin
      ansible.builtin.copy:
        dest: "{{ user_home }}/.local/bin/ntlm_theft"
        mode: '0755'
        content: |
          #!/bin/bash
          exec python3 "{{ user_home }}/Binaries/ntlm_theft/ntlm_theft.py" "$@"

    - name: Add custom Zsh configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/.zshrc"
        dest: "{{ user_home }}/.zshrc"
        mode: '0644'

    # qterminal (Kali's default terminal) only creates ~/.config/qterminal.org
    # on first launch, so create it here or the config copy fails on a fresh box.
    - name: Ensure qterminal config directory exists
      ansible.builtin.file:
        path: "{{ user_home }}/.config/qterminal.org"
        state: directory
        mode: '0755'

    - name: Add custom Terminal configuration
      ansible.builtin.template:
        src: "{{ playbook_dir }}/files/qterminal.ini.j2"
        dest: "{{ user_home }}/.config/qterminal.org/qterminal.ini"
        mode: '0644'

    - name: Add custom Tmux configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/.tmux.conf"
        dest: "{{ user_home }}/.tmux.conf"
        mode: '0644'

    # Referenced by name (not path) from .tmux.conf's @override_copy_command and
    # .zshrc's clip(), so it must be executable and on PATH.
    - name: Add SSH-aware clipboard helper
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/clipcopy"
        dest: "{{ user_home }}/.local/bin/clipcopy"
        mode: '0755'

    - name: Ensure VS Code user config directory exists
      ansible.builtin.file:
        path: "{{ user_home }}/.config/Code/User"
        state: directory
        mode: '0755'

    - name: Deploy VS Code settings (theme + icon theme)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/vscode/settings.json"
        dest: "{{ user_home }}/.config/Code/User/settings.json"
        mode: '0644'

    - name: List installed VS Code extensions
      ansible.builtin.command: code --list-extensions
      register: vscode_installed
      changed_when: false

    - name: Install VS Code extensions
      ansible.builtin.command: "code --install-extension {{ item }}"
      loop: "{{ vscode_extensions }}"
      when: (item | lower) not in (vscode_installed.stdout_lines | map('lower') | list)
      register: net_retry
      until: net_retry is succeeded
      retries: 3
      delay: 5

    - name: Create Autorecon directory
      become: true
      ansible.builtin.file:
        path: "/root/.config/AutoRecon/"
        state: directory
        mode: '0755'

    - name: Add custom Autorecon configuration
      become: true
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/config.toml"
        dest: "/root/.config/AutoRecon/config.toml"
        mode: '0644'

    - name: Add custom .profile for paths
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/.profile"
        dest: "{{ user_home }}/.profile"
        mode: '0644'

    - name: Ensure tmux plugin directory exists
      ansible.builtin.file:
        path: "{{ user_home }}/.tmux/plugins"
        state: directory
        mode: '0755'

    - name: Clone TPM plugin
      ansible.builtin.git:
        repo: 'https://github.com/tmux-plugins/tpm'
        dest: '{{ user_home }}/.tmux/plugins/tpm'
        version: 'master'
        update: true
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Install TPM plugins
      ansible.builtin.shell: |
        ~/.tmux/plugins/tpm/bin/install_plugins
      args:
        executable: /bin/bash
        creates: "{{ user_home }}/.tmux/plugins/tmux-resurrect"
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Create random wallpaper script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/.updatewallpaper.sh"
        dest: "{{ user_home }}/.updatewallpaper.sh"
        mode: '0755'

    # Install Docker
    - name: Ensure apt keyrings directory exists
      become: true
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Install Docker GPG key
      become: true
      ansible.builtin.shell: |
        set -o pipefail
        wget -qO- {{ docker_gpg_key_url }} | gpg --dearmor --yes -o /etc/apt/keyrings/docker.gpg
      args:
        executable: /bin/bash
      changed_when: false

    - name: Add Docker repository
      become: true
      ansible.builtin.lineinfile:
        dest: /etc/apt/sources.list.d/docker.list
        line: "{{ docker_repo }}"
        create: true

    - name: Install Docker packages
      become: true
      ansible.builtin.apt:
        update_cache: true
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Start Docker service
      become: true
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Add user to docker group
      become: true
      ansible.builtin.user:
        name: "{{ user }}"
        groups: docker
        append: true

    - name: Create Engagement directory
      ansible.builtin.file:
        path: "{{ user_home }}/Engagement"
        state: directory
        mode: '0755'

    - name: Create Binaries directory
      ansible.builtin.file:
        path: "{{ user_home }}/Binaries"
        state: directory
        mode: '0755'

    - name: Create Staging directory
      ansible.builtin.file:
        path: "{{ user_home }}/Staging"
        state: directory
        mode: '0755'

    - name: Install updog via pipx
      ansible.builtin.command: pipx install updog
      args:
        creates: "{{ user_home }}/.local/bin/updog"
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Install bloodyAD via pipx
      ansible.builtin.command: pipx install bloodyAD
      args:
        creates: "{{ user_home }}/.local/bin/bloodyAD"
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Install Penelope via pipx
      ansible.builtin.command: pipx install git+https://github.com/brightio/penelope
      args:
        creates: "{{ user_home }}/.local/bin/penelope"
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Install Git Dumper via pipx
      ansible.builtin.command: pipx install git-dumper
      args:
        creates: "{{ user_home }}/.local/bin/git-dumper"
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Install ssh audit via pipx
      ansible.builtin.command: pipx install ssh-audit
      args:
        creates: "{{ user_home }}/.local/bin/ssh-audit"
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Install creds via pipx
      ansible.builtin.command: pipx install defaultcreds-cheat-sheet
      args:
        creates: "{{ user_home }}/.local/bin/creds"
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Install impacket via pipx
      ansible.builtin.command: pipx install impacket
      args:
        creates: "{{ user_home }}/.local/pipx/venvs/impacket"
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Install nxc via pipx
      become: true
      ansible.builtin.command: pipx install git+https://github.com/Pennyw0rth/NetExec --global
      args:
        creates: /usr/local/bin/nxc
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Install RustHound via Cargo
      ansible.builtin.command: cargo install rusthound-ce
      args:
        creates: "{{ user_home }}/.cargo/bin/rusthound-ce"
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Install adscan via pipx
      ansible.builtin.command: pipx install adscan
      args:
        creates: "{{ user_home }}/.local/bin/adscan"
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Install firefox_decrypt via pipx
      ansible.builtin.command: pipx install git+https://github.com/unode/firefox_decrypt
      args:
        creates: "{{ user_home }}/.local/bin/firefox-decrypt"
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Install WES-NG via pipx
      ansible.builtin.command: pipx install wesng
      args:
        creates: "{{ user_home }}/.local/bin/wes"
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Download tools to Binaries folder
      ansible.builtin.get_url:
        url: "{{ item }}"
        dest: "{{ user_home }}/Binaries"
        mode: '0755'
        force: true
      loop:
        - https://github.com/0xb11a1/yetAnotherObfuscator/releases/download/1.1/yetAnotherObfuscator_v1.1.zip
        - https://raw.githubusercontent.com/decoder-it/printerbugnew/refs/heads/main/printerbugnew.py
        - https://github.com/ropnop/kerbrute/releases/download/v1.0.3/kerbrute_linux_amd64
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    # BloodHound CLI (SpecterOps) manages the Dockerized BloodHound CE stack.
    # unarchive downloads and unpacks in one step (wget + tar -xvzf); it relies
    # on the Docker install task above and the tar/gzip that ship with Kali.
    - name: Download and unpack BloodHound CLI to Binaries folder
      ansible.builtin.unarchive:
        src: https://github.com/SpecterOps/bloodhound-cli/releases/latest/download/bloodhound-cli-linux-amd64.tar.gz
        dest: "{{ user_home }}/Binaries"
        remote_src: true
        mode: '0755'
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Check for existing bloodhound-cli symlink
      ansible.builtin.stat:
        path: "{{ user_home }}/.local/bin/bloodhound-cli"
      register: bloodhound_cli_link

    # Deliberately halts the run if the link is already present, per request —
    # an existing bloodhound-cli in ~/.local/bin means a prior/manual setup we
    # do not want to silently overwrite.
    - name: Fail if bloodhound-cli symlink already exists
      ansible.builtin.fail:
        msg: "bloodhound-cli already exists at {{ user_home }}/.local/bin/bloodhound-cli; stopping setup."
      when: bloodhound_cli_link.stat.exists

    - name: Symlink bloodhound-cli into ~/.local/bin
      ansible.builtin.file:
        src: "{{ user_home }}/Binaries/bloodhound-cli"
        dest: "{{ user_home }}/.local/bin/bloodhound-cli"
        state: link

    - name: Download LFI Wordlists to their folder
      become: true
      ansible.builtin.get_url:
        url: "{{ item }}"
        dest: "/usr/share/seclists/Fuzzing/LFI"
        mode: '0644'
      loop:
        - https://raw.githubusercontent.com/carlospolop/Auto_Wordlists/refs/heads/main/wordlists/file_inclusion_linux.txt
        - https://raw.githubusercontent.com/carlospolop/Auto_Wordlists/refs/heads/main/wordlists/file_inclusion_windows.txt
