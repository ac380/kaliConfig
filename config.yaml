    - name: Clone Statistically Likely Repo
      become: true
      ansible.builtin.git:
        repo: 'https://github.com/insidetrust/statistically-likely-usernames.git'
        dest: '/usr/share/wordlists/StatisticallyLikelyUsernames'
        version: 'master'
        update: true
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Clone Sharp Collection Repo
      ansible.builtin.git:
        repo: 'https://github.com/Flangvik/SharpCollection.git'
        dest: '{{ user_home }}/Staging/SharpCollection'
        version: 'master'
        update: true
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Clone Obfuscated Sharp Collection Repo
      ansible.builtin.git:
        repo: 'https://github.com/Flangvik/ObfuscatedSharpCollection.git'
        dest: '{{ user_home }}/Staging/obfuscatedSharpCollection'
        version: 'main'
        update: true
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Copy Tools Recap txt file
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/files/binariesRecap.txt'
        dest: '{{ user_home }}/Staging/binariesRecap.txt'
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: "0644"

    - name: Ensure BurpSuite extras directory exists
      become: true
      ansible.builtin.file:
        path: "{{ burpsuite_extras_dir }}"
        state: directory
        mode: '0755'

    - name: Download BurpSuite extra JARs
      become: true
      ansible.builtin.get_url:
        url: "{{ item.value.url }}"
        dest: "{{ burpsuite_extras_dir }}/{{ item.value.jar }}"
        checksum: "{{ item.value.checksum }}"
        mode: '0644'
      loop: "{{ burpsuite_extras_jars | dict2items }}"
      register: net_retry
      until: net_retry is succeeded
      retries: 5
      delay: 10

    - name: Update Firefox policies
      become: true
      ansible.builtin.template:
        src: "{{ playbook_dir }}/files/policies.json.j2"
        dest: "/usr/share/firefox-esr/distribution/policies.json"
        mode: '0644'

    - name: Check and create username-anarchy symlink if it doesn't exist
      ansible.builtin.shell: |
        if [ ! -L ~/.local/bin/username-anarchy ]; then
          ln -s ~/Binaries/username-anarchy/username-anarchy ~/.local/bin/username-anarchy
        fi
      args:
        executable: /bin/bash
        creates: "{{ user_home }}/.local/bin/username-anarchy"

    - name: Load xfce4 panel profile
      ansible.builtin.shell: |
        xfce4-panel-profiles load {{ playbook_dir }}/files/panel.tar.bz2 &&
        touch "{{ user_home }}/.config/.panel_profile_loaded"
      args:
        creates: "{{ user_home }}/.config/.panel_profile_loaded"

    - name: Remove the <Alt>Delete window keyboard shortcut
      community.general.xfconf:
        channel: xfce4-keyboard-shortcuts
        property: "/xfwm4/custom/<Alt>Delete"
        state: absent

    - name: Disable desktop icons (set desktop icon style to none)
      community.general.xfconf:
        channel: xfce4-desktop
        property: /desktop-icons/style
        value: 0
        value_type: int

    - name: Clean up unused packages and cache
      become: true
      ansible.builtin.apt:
        autoremove: true
        clean: true

    - name: Display post-installation reminders
      ansible.builtin.debug:
        msg:
          - "Reboot to activate docker group membership."
          - "After reboot, finish adscan setup: run 'adscan install' (pulls Docker images), then 'adscan start'."
          - "WES-NG: run 'wes --update' to fetch the CVE definitions before first use."
