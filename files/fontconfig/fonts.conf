<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- Generic "monospace" resolves to JetBrains Mono system-wide. Uses the
       Nerd Font Mono build so Nerd Font glyphs stay inside one cell instead
       of overlapping the next character. -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Mono</family>
      <family>Noto Color Emoji</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>

  <!-- Emoji fallback: keep colour emoji reachable from the mono font, since
       JetBrains Mono has no emoji coverage of its own. -->
  <match target="pattern">
    <test name="family"><string>JetBrainsMono Nerd Font Mono</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- Rendering: mirrors ~/.Xresources for apps that read fontconfig directly
       (GTK, Qt) rather than Xft resources. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>

</fontconfig>
