set-option -g prefix C-Space
unbind-key C-b
bind-key C-Space send-prefix

# Clipboard: this box is normally reached over SSH (often through an RDP jump
# host), so X11 tools like xsel/xclip are useless -- they write to *this*
# machine's X clipboard, which nobody is looking at, and silently no-op when
# there is no $DISPLAY. The only mechanism that crosses SSH is OSC 52, where
# the outer terminal emulator performs the clipboard write.
#
# `clipcopy` (~/.local/bin) writes to the local X clipboard *and* emits OSC 52,
# so every tmux-yank path (mouse drag, `y`, Enter) is correct whether this box is
# used at its own desktop or over SSH. Without the override tmux-yank would find
# xsel on PATH and go back to the local-only behaviour.
set -g @override_copy_command 'clipcopy'
set -g @yank_selection_mouse 'clipboard'
set -g @yank_selection 'clipboard'

# Send OSC 52 out to the parent terminal on copy, and accept it from programs
# running inside tmux.
set -g set-clipboard on

# Advertise clipboard capability for every outer terminal. tmux only emits
# OSC 52 if it believes the terminal supports it (terminfo `Ms`), and most
# $TERM values arriving over SSH don't declare it.
set -as terminal-features ',*:clipboard'

bind -n M-q split-window -v -c "#{pane_current_path}"
bind -n M-w split-window -h -c "#{pane_current_path}"

bind -n C-n new-window -c "#{pane_current_path}"

bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded."

set-environment -g TERM "tmux-256color"
set -g default-terminal "tmux-256color"

set-option -g history-limit 50000
set-option -g status-position top

set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm' # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m' # underscore colours - needs tmux-3.0

# Enable 24-bit (truecolor) passthrough so RGB output isn't quantized to 256.
set -ga terminal-features ',*:RGB'

# Lower escape-time so Esc and Alt-key bindings feel responsive (default 500ms).
set -sg escape-time 10

# set the statusline color (default is transparent, color256)
set -g status-left-style bg=default,fg=colour207,bold
set -g status-style bg=default,fg=colour117,bold
set -g status-right-style bg=default,fg=colour102,bold

set -g status-right "#T"

# set pane border colors
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour161

set -g mouse on

# Escape hatch: with mouse on, tmux swallows drags, so the outer terminal's own
# selection (which always reaches the real clipboard) is unavailable. Shift+drag
# bypasses tmux capture in most terminals; `prefix + m` toggles mouse mode off
# entirely when you need a clean native selection across a whole pane.
bind-key m set -g mouse \; display-message "mouse: #{?mouse,on,off}"

# tpm plugin
set -g @plugin "tmux-plugins/tpm"

# tmux plugins
# NOTE: vim-tmux-navigator removed - it rebinds C-h/j/k/l (stealing C-l "clear")
# and only pays off with vim splits, which this setup doesn't use (VS Code).
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "omerxx/tmux-sessionx"

# initialize tpm (keep at bottom of tmux.conf)
run "~/.tmux/plugins/tpm/tpm"

# Force Emacs-style keys in copy-mode (optional)
setw -g mode-keys emacs

# Copy-mode key bindings
bind -T copy-mode Space send-keys -X begin-selection
# No external command here on purpose: copy-selection-and-cancel stores the
# text in a tmux buffer, and `set-clipboard on` above emits OSC 52 for it.
bind -T copy-mode Enter send-keys -X copy-selection-and-cancel

# Enable Rectanble Selection in copy-mode
bind-key -T copy-mode F7 send -X rectangle-toggle