# i3blocks config file  (man i3blocks)
# Scripts live in ~/.config/i3/blocks/ (self-contained, no i3blocks-contrib needed)

command=$HOME/.config/i3/blocks/$BLOCK_NAME
separator_block_width=22
separator=false
markup=none

[cpu_usage]
label= CPU
interval=5

[memory]
label= RAM
interval=10

[disk]
label= Disk
instance=/
interval=60

[bandwidth]
instance=eth0
label=
interval=5

# LAN IP (eth0 / default route)
[iface]
instance=eth0
label=
color=#3BB92D
interval=30

# VPN IP: only shown while tun0 is up
[iface]
instance=tun0
label= VPN
color=#F5A623
interval=30

[time]
label=
command=date '+%a %d %b %Y  %H:%M:%S '
interval=1
